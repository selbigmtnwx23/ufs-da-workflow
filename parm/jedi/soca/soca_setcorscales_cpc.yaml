resolution:
  geom_grid_file: ./soca_gridspec.nc
  mom6_input_nml: ./input.nml
  fields metadata: ./fields_metadata.yaml

date: "0000-00-00T00:00:00Z"

corr variables:
- sea_water_salinity
- sea_water_potential_temperature
- eastward_sea_water_velocity
- northward_sea_water_velocity
- sea_surface_height_above_geoid

scales:
  vert layers: 6 # in units of layer
  sea_water_salinity:
    rossby mult: 1.0
    min grid mult: 1.0
    base value: 20000.0
  sea_water_potential_temperature:
    rossby mult: 1.0
    min grid mult: 1.0
    base value: 20000.0
  eastward_sea_water_velocity:
    rossby mult: 1.0
    min grid mult: 1.0
    base value: 15000.0
  northward_sea_water_velocity:
    rossby mult: 1.0
    min grid mult: 1.0
    base value: 15000.0
  sea_surface_height_above_geoid:
    rossby mult: 1.0
    min grid mult: 1.0
    base value: 15000.0

rh output:
  datadir: ./
  exp: cor_rh
  type: incr

rv output:
  datadir: ./
  exp: cor_rv
  type: incr
