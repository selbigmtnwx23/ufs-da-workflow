# common filters used later on
_: &land_mask
  filter: Domain Check
  where:
  - variable: {name: GeoVaLs/sea_area_fraction}
    minvalue: 0.5

cost function:
  cost type: 3D-Var
  time window:
    begin: {{ soca_timewindow_begin_iso }}
    length: P1D
  analysis variables: &soca_an_vars
  - sea_water_salinity
  - sea_water_potential_temperature
  - sea_surface_height_above_geoid

  geometry: &geom
    geom_grid_file: ./soca_gridspec.nc
    mom6_input_nml: ./input.nml
    fields metadata: ./fields_metadata.yaml

  background:
    read_from_file: 1
    basename: ./
    ocn_filename: MOM.res.nc
    date: &bkg_date {{ soca_background_date_iso }}
    state variables: &soca_bg_vars
    - sea_water_salinity
    - sea_water_potential_temperature
    - sea_surface_height_above_geoid
    - sea_water_cell_thickness
    - ocean_mixed_layer_thickness
    - sea_water_depth

  background error:
    covariance model: SABER
    saber central block:
      saber block name: diffusion
      read:
        groups:
        - variables:
          - sea_water_potential_temperature
          - sea_water_salinity
          - sea_surface_height_above_geoid
          horizontal:
            filepath: ./{{ soca_bkg_error_hz_fn }}
          vertical:
            levels: {{ MOM6_NK }}
            filepath: ./{{ soca_bkg_error_vt_fn }}

    saber outer blocks:
    - saber block name: SOCABkgErrFilt
      ocean_depth_min: 1000 # [m]
      rescale_bkgerr: 1.0
      efold_z: 1000.0       # [m]

    - saber block name: SOCAParametricOceanStdDev
      temperature:
        sst:
          filepath: ./godas_sst_bgerr.nc
          variable: sst_bgerr
      unbalanced salinity: {} # use default values
      unbalanced ssh: {} # use default values
      other variables:
      - variable: eastward_sea_water_velocity
        fraction of background: 0.2
      - variable: northward_sea_water_velocity
        fraction of background: 0.2

    date: *bkg_date

    linear variable change:
      input variables: *soca_an_vars
      output variables: *soca_an_vars
      linear variable changes:

      - linear variable change name: BalanceSOCA
        kst:
          dsdtmax: 0.1
          dsdzmin: 3.0e-6
          dtdzmin: 1.0e-6
          nlayers: 10
        ksshts:
          nlayers: 10

  observations:
    observers:
{%- if OBS_SOCA_RTOFS == "YES" %}
    - obs space:
        name: InsituTemperature
        obsdataout:
          engine:
            type: H5File
            obsfile: ./diag/diag.InsituTemperature_{{ cdate }}.nc
        obsdatain:
          engine:
            type: H5File
            obsfile: ./obs/obs.{{ PDY }}.{{ cycle }}.rtofs_prof_waterTemperature.nc
        simulated variables: [waterTemperature]
      obs operator:
        name: InsituTemperature
      obs error:
        covariance model: diagonal
      obs filters:
      - *land_mask
      - filter: Background Check
        threshold: 5

    - obs space:
        name: InsituSalinity
        obsdataout:
          engine:
            type: H5File
            obsfile: ./diag/diag.InsituSalinity_{{ cdate }}.nc
        obsdatain:
          engine:
            type: H5File
            obsfile: ./obs/obs.{{ PDY }}.{{ cycle }}.rtofs_prof_salinity.nc
        simulated variables: [salinity]
      obs operator:
        name: VertInterp
        observation alias file: ./obsop_name_map.yaml
        vertical coordinate: sea_water_depth
        observation vertical coordinate: depth
        interpolation method: linear
      obs error:
        covariance model: diagonal
      obs filters:
      - *land_mask
{%- endif %}

    - obs space:
        name: SeaSurfaceTemp
        obsdataout:
          engine:
            type: H5File
            obsfile: ./diag/diag.SeaSurfaceTemp_{{ cdate }}.nc
        obsdatain:
          engine:
            type: H5File
            obsfile: ./obs/sst_satellite.nc
        simulated variables: [seaSurfaceTemperature]
      obs operator:
        name: Identity
        observation alias file: ./obsop_name_map.yaml
      obs error:
        covariance model: diagonal
      obs filters:
      - *land_mask
      - filter: Bounds Check
        minvalue: 5.0
        maxvalue: 35.0
      - filter: Background Check
        threshold: 5
      - filter: Domain Check
        where:
        - variable: {name: ObsError/seaSurfaceTemperature}
          minvalue: 0.001
 
    - obs space:
        name: SeaSurfaceSalinity
        obsdataout:
          engine:
            type: H5File
            obsfile: ./diag/diag.SeaSurfaceSalinity_{{ cdate }}.nc
        obsdatain:
          engine:
            type: H5File
            obsfile: ./obs/sss_salinity.nc
        simulated variables: [seaSurfaceSalinity]
      obs operator:
        name: Identity
        observation alias file: ./obsop_name_map.yaml
      obs error:
        covariance model: diagonal
      obs filters:
      - *land_mask
      - filter: Bounds Check
        minvalue: 0.1
        maxvalue: 40.0
      - filter: Background Check
        threshold: 5.0
      - filter: Domain Check
        where:
        - variable: {name: GeoVaLs/sea_surface_temperature}
          minvalue: 15

    - obs space:
        name: ADT
        obsdataout:
          engine:
            type: H5File
            obsfile: ./diag/diag.ADT_{{ cdate }}.nc
        obsdatain:
          engine:
            type: H5File
            obsfile: ./obs/adt_ssh.nc
        simulated variables: [absoluteDynamicTopography]
      obs operator:
        name: ADT
      obs error:
        covariance model: diagonal
      obs filters:
      - *land_mask
      - filter: Background Check
        absolute threshold: 0.2

variational:
  minimizer:
    algorithm: RPCG
  iterations:
  - geometry: *geom
    ninner: 5
    gradient norm reduction: 1e-3

output:
  datadir: ./
  exp: 3dvar
  type: an

