geometry: &geom
  geom_grid_file: ./soca_gridspec.nc
  mom6_input_nml: ./input.nml
  fields metadata: ./fields_metadata.yaml

background:
  read_from_file: 1
  basename: {{ soca_background_basename }}/
  date: &date {{ soca_background_date_iso }}
  ocn_filename: MOM.res.nc
  state variables:
  - sea_water_salinity
  - sea_water_potential_temperature
  - eastward_sea_water_velocity
  - northward_sea_water_velocity
  - sea_surface_height_above_geoid

background error:
  covariance model: SABER
  saber central block:
    saber block name: diffusion
    calibration:
      normalization:
        iterations: 1000       #< in the real world you'll want to use 1e4 or so
      groups:
      - horizontal:
          model file:
            date: *date
            basename: ./
            ocn_filename: {{ soca_bkg_error_hz_ocn_fn }}
          model variable: sea_surface_height_above_geoid
        write:
          filepath: ./{{ soca_diff_cor_hz_fn }}
      - vertical:
          model file:
            date: *date
            basename: ./
            ocn_filename: {{ soca_bkg_error_vt_ocn_fn }}
          model variable: sea_water_potential_temperature
        write:
          filepath: ./{{ soca_diff_cor_vt_fn }}

