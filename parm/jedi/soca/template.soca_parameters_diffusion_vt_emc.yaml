geometry:
  geom_grid_file: ./soca_gridspec.nc
  mom6_input_nml: ./input.nml
  fields metadata: ./fields_metadata.yaml
background:
  read_from_file: 1
  basename: {{ soca_background_basename }}/
  ocn_filename: {{ soca_background_filename_ocn }}
  date: &date {{ soca_background_date_iso }}
  state variables:
  - sea_water_potential_temperature
background error:
  covariance model: SABER
  saber central block:
    saber block name: diffusion
    geometry:
      geom_grid_file: ./soca_gridspec.nc
      mom6_input_nml: ./mom_input.nml
      fields metadata: ./fields_metadata.yaml
    calibration:
      normalization:
        method: randomization
        iterations: 1000
      groups:
      - vertical:
          as gaussian: true
          levels: '25'
          model file:
            date: *date
            basename: ./
            ocn_filename: {{ soca_vt_scales_fn }}
          model variable: sea_water_potential_temperature
        write:
          filepath: ./staticb/{{ soca_diff_cor_vt_fn }}
